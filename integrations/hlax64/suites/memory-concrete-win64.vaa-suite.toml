# Phase C/D depth — concrete-bounds memory cells (Win64).
# Literal region length ⇒ SemASM Verified (≠ VerifiedUnderPreconditions).
# Requires SemASM tip with builtin.buffer.load_byte0 / store_byte0.
schema_version = "0.1"
suite_id = "hlax64.backend.memory-concrete.win64.v0"
target = "x86_64-pc-windows-msvc"
abi = "win64"
stack_lock = "../stack.lock.toml"
required_cases = [
  "../cases/load_byte0",
  "../cases/store_byte0",
]

[generator]
spec = "../generator.spec.toml"

[policy]
require_all_cases = true
allow_verified_under_preconditions = false
allow_incomplete = false
stop_on_first_failure = false
max_parallel_cases = 1

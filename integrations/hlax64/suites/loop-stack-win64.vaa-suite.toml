# Phase B — loops and stack (plan §17.2). Named cases replace the sum_i64
# proxy. Gate: SemASM pure-int unary i64 v2 (sum_range + identity aliases,
# SemASM tip after Phase-B oracle bump). Live path is emit/generate; SemASM
# Gate evidence is claimed only by a full `vaa suite run` (no --skip-verify).
schema_version = "0.1"
suite_id = "hlax64.backend.loop-stack.win64.v0"
target = "x86_64-pc-windows-msvc"
abi = "win64"
stack_lock = "../stack.lock.toml"
required_cases = [
  "../cases/sum_range",
  "../cases/countdown_loop",
  "../cases/stack_local_i64",
  "../cases/forced_register_spill",
]

[generator]
spec = "../generator.spec.toml"

[policy]
require_all_cases = true
allow_verified_under_preconditions = false
allow_incomplete = false
stop_on_first_failure = false
max_parallel_cases = 1

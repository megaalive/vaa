# Phase B named loops/stack — SysV parity.
# Live generate via generator.sysv.spec.toml; Gate on Linux (SemASM ecde423+).
schema_version = "0.1"
suite_id = "hlax64.backend.loop-stack.sysv.v0"
target = "x86_64-unknown-linux-gnu"
abi = "sysv"
stack_lock = "../stack.lock.toml"
required_cases = [
  "../cases/sum_range_sysv",
  "../cases/countdown_loop_sysv",
  "../cases/stack_local_i64_sysv",
  "../cases/forced_register_spill_sysv",
]

[generator]
spec = "../generator.sysv.spec.toml"

[policy]
require_all_cases = true
allow_verified_under_preconditions = false
allow_incomplete = false
stop_on_first_failure = false
max_parallel_cases = 1

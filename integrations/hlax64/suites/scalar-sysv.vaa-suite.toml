# Phase A SysV parity — scalar leaves (plan §17 target/ABI parity).
# Cases declare linux-gnu + sysv and now generate live via the SysV spec
# (emit-nasm --target linux-x64-sysv). SemASM Gate evidence on Linux is
# claimed only by a full `vaa suite run` (no --skip-verify).
schema_version = "0.1"
suite_id = "hlax64.backend.scalar.sysv.v0"
target = "x86_64-unknown-linux-gnu"
abi = "sysv"
stack_lock = "../stack.lock.toml"
required_cases = [
  "../cases/min_usize_sysv",
  "../cases/max_usize_sysv",
]

[generator]
spec = "../generator.sysv.spec.toml"

[policy]
require_all_cases = true
allow_verified_under_preconditions = false
allow_incomplete = false
stop_on_first_failure = false
max_parallel_cases = 1

# EchoAsm Gate — second-generator Verified (scalar identity leaf).
# Beyond concrete memory cells: pure-int return_i64 via copy-generator.
# Honesty: universality smoke ≠ CryptOpt; practice seal ≠ trust root.
schema_version = "0.1"
suite_id = "echoasm.gate.scalar-i64.win64.v0"
target = "x86_64-pc-windows-msvc"
abi = "win64"
stack_lock = "../stack.lock.toml"
required_cases = [
  "../cases/return_i64_echo",
]

[generator]
spec = "../generator.spec.toml"

[policy]
require_all_cases = true
allow_verified_under_preconditions = false
allow_incomplete = false
stop_on_first_failure = false
max_parallel_cases = 1

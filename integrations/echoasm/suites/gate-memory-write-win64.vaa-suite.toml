# EchoAsm Gate - Phase D memory writes (honesty-bound).
# Symbolic-length leaves -> VerifiedUnderPreconditions (!= unconditional Verified).
schema_version = "0.1"
suite_id = "echoasm.gate.memory-write.win64.v0"
target = "x86_64-pc-windows-msvc"
abi = "win64"
stack_lock = "../stack.lock.toml"
required_cases = [
  "../cases/replace_byte_echo",
  "../cases/memset_echo",
  "../cases/memcpy_echo",
]

[generator]
spec = "../generator.spec.toml"

[policy]
require_all_cases = true
allow_verified_under_preconditions = true
allow_incomplete = false
stop_on_first_failure = false
max_parallel_cases = 1

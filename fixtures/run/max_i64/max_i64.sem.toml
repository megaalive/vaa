contract_version = "0.1"

[function]
name = "max_i64"
summary = "Return the larger (signed) of two i64 values"

[[function.parameters]]
name = "a"
type = "i64"
role = "input"

[[function.parameters]]
name = "b"
type = "i64"
role = "input"

[[function.returns]]
name = "result"
type = "i64"

[[function.ensures]]
expression = "true"
reason = "Max semantics are proven by the behavioral oracle and synthesized vectors."

[function.constraints]
no_heap = true
no_recursion = true
bounded_stack_bytes = 128

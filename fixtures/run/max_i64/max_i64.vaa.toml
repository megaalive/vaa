schema_version = "0.1"
task_id = "max-i64-win64-corpus-v1"
artifact_kind = "callable-function"
target = "x86_64-pc-windows-msvc"

[entry]
symbol = "max_i64"
abi = "win64"

[inputs.a]
kind = "i64"

[inputs.b]
kind = "i64"

[output]
kind = "i64"

[behavior]
summary = "Return the larger (signed) of a and b."

[capabilities]
syscalls = []
imports = []
heap = false
filesystem = false
network = false
environment = false
clock = false
random = false

[memory]
max_stack_bytes = 128
allow_global_writable = false
allow_self_modifying_code = false

[instructions]
required_features = ["x86-64-baseline"]
forbidden_mnemonics = []
allow_unknown_semantics = false

[verification]
require_complete_lowering = true
require_abi_check = true
require_object_inspection = true
require_behavioral_tests = true
require_reproducible_build = true

[budgets]
max_candidates = 4
max_repairs_per_candidate = 2
max_wall_time_seconds = 300
max_model_tokens = 24000
max_no_progress_iterations = 1

[delivery]
include_source = true
include_object = true
include_binary = false
include_evidence = true

[[tests]]
name = "b_larger"
expected = 2

[tests.input]
a = 1
b = 2

[[tests]]
name = "a_larger"
expected = 5

[tests.input]
a = 5
b = 3

[[tests]]
name = "negative_pair"
expected = -3

[tests.input]
a = -7
b = -3

[[tests]]
name = "equal"
expected = 4

[tests.input]
a = 4
b = 4

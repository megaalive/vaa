name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build --workspace --all-targets --all-features
      - name: Test
        run: cargo test --workspace --all-features
      - name: Install cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # P8-F: fail-closed parser fuzz smoke (not a security certification).
  fuzz:
    name: Fuzz smoke (PR-022)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz smoke (30s each target)
        run: |
          set -euo pipefail
          for t in task_toml seal_envelope transparency_doc cache_verification_record; do
            echo "::group::fuzz $t"
            cargo +nightly fuzz run "$t" -- -max_total_time=30 -max_len=4096
            echo "::endgroup::"
          done

  # P8-K: SoftHSM2 PKCS#11 live signer smoke (Linux only; not hardware HSM).
  pkcs11-softhsm:
    name: SoftHSM PKCS#11 smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Install SoftHSM2
        run: sudo apt-get update && sudo apt-get install -y softhsm2
      - name: Configure SoftHSM token
        run: |
          set -euo pipefail
          TOK="${RUNNER_TEMP}/softhsm/tokens"
          mkdir -p "$TOK"
          CONF="${RUNNER_TEMP}/softhsm/softhsm2.conf"
          printf 'directories.tokendir = %s\nobjectstore.backend = file\n' "$TOK" > "$CONF"
          export SOFTHSM2_CONF="$CONF"
          echo "SOFTHSM2_CONF=${CONF}" >> "$GITHUB_ENV"
          MODULE=""
          for p in /usr/lib/softhsm/libsofthsm2.so /usr/lib/x86_64-linux-gnu/softhsm/libsofthsm2.so; do
            if [ -f "$p" ]; then MODULE="$p"; break; fi
          done
          test -n "$MODULE"
          echo "VAA_HSM_MODULE=${MODULE}" >> "$GITHUB_ENV"
          softhsm2-util --init-token --free --label vaa-ci --pin 1234 --so-pin 5678
      - name: SoftHSM round-trip test
        env:
          VAA_PKCS11_LIVE: "1"
          VAA_HSM_PIN: "1234"
          VAA_HSM_SO_PIN: "5678"
          VAA_HSM_KEY_LABEL: vaa
        run: cargo test --features pkcs11 softhsm_live_round_trip -- --nocapture

  # Gate-1: live SemASM Incomplete smoke (count_byte Win64, no --allow-execution).
  # This is NOT a Verified vertical slice â€” see docs/progress.md.
  semasm-gate1:
    name: Gate-1 SemASM Incomplete (Win64)
    runs-on: windows-latest
    steps:
      - name: Checkout VAA
        uses: actions/checkout@v6

      - name: Checkout SemASM
        uses: actions/checkout@v6
        with:
          repository: megaalive/semasm
          path: semasm
          # Pin: SemASM tip 928bd66 (find_* memory-leaf + Sei).
          ref: 928bd66569320674cd49e4dd7758da17b03338c2

      - name: Install NASM and LLVM (lld-link)
        run: choco install nasm llvm --no-progress -y

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            semasm

      - name: Build SemASM CLI
        working-directory: semasm
        run: cargo build -p semasm-cli --release

      - name: Put semasm on PATH
        shell: pwsh
        run: |
          $semasmBin = Join-Path $env:GITHUB_WORKSPACE "semasm\target\release"
          if (-not (Test-Path (Join-Path $semasmBin "semasm.exe"))) {
            throw "semasm.exe missing under $semasmBin"
          }
          echo $semasmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$semasmBin;$env:PATH"
          Get-Command semasm | Format-List
          semasm --version

      - name: Doctor + live status compare (R6)
        shell: pwsh
        run: ./scripts/ci-doctor-live-probe.ps1

      - name: Record tool versions
        shell: pwsh
        run: |
          nasm --version
          lld-link --version

      - name: Gate-1 signed ingest + Incomplete verify
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target/vaa-transparency/gate1 | Out-Null
          ./scripts/ci-gate-sign-setup.ps1 -PublicKeyOut target/vaa-transparency/gate1/public_key.txt
          cargo test --test semasm_gate1_smoke -- --ignored --nocapture

      - name: Export + verify-transparency (Gate-1)
        shell: pwsh
        run: |
          ./scripts/ci-gate-transparency.ps1 `
            -RunBase target/vaa-gate1-runs `
            -OutDir target/vaa-transparency/gate1 `
            -PublicKeySrc target/vaa-transparency/gate1/public_key.txt

      - name: Upload Gate-1 transparency artifact
        uses: actions/upload-artifact@v6
        with:
          name: gate1-transparency
          path: target/vaa-transparency/gate1/
          if-no-files-found: error

  # Gate-2: opt-in behavioral Verified (count_byte Win64 + --allow-execution).
  semasm-gate2:
    name: Gate-2 SemASM Verified (Win64)
    runs-on: windows-latest
    steps:
      - name: Checkout VAA
        uses: actions/checkout@v6

      - name: Checkout SemASM
        uses: actions/checkout@v6
        with:
          repository: megaalive/semasm
          path: semasm
          # Pin: SemASM tip 928bd66 (find_* memory-leaf + Sei).
          ref: 928bd66569320674cd49e4dd7758da17b03338c2

      - name: Install NASM and LLVM (lld-link)
        run: choco install nasm llvm --no-progress -y

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            semasm

      - name: Build SemASM CLI
        working-directory: semasm
        run: cargo build -p semasm-cli --release

      - name: Put semasm on PATH
        shell: pwsh
        run: |
          $semasmBin = Join-Path $env:GITHUB_WORKSPACE "semasm\target\release"
          if (-not (Test-Path (Join-Path $semasmBin "semasm.exe"))) {
            throw "semasm.exe missing under $semasmBin"
          }
          echo $semasmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$semasmBin;$env:PATH"
          Get-Command semasm | Format-List
          semasm --version

      - name: Doctor + live status compare (R6)
        shell: pwsh
        run: ./scripts/ci-doctor-live-probe.ps1

      - name: Gate-2 signed ingest + Verified
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target/vaa-transparency/gate2 | Out-Null
          ./scripts/ci-gate-sign-setup.ps1 -PublicKeyOut target/vaa-transparency/gate2/public_key.txt
          cargo test --test semasm_gate2_smoke -- --ignored --nocapture

      - name: Export + verify-transparency (Gate-2)
        shell: pwsh
        run: |
          ./scripts/ci-gate-transparency.ps1 `
            -RunBase target/vaa-gate2-runs `
            -OutDir target/vaa-transparency/gate2 `
            -PublicKeySrc target/vaa-transparency/gate2/public_key.txt

      - name: Upload Gate-2 transparency artifact
        uses: actions/upload-artifact@v6
        with:
          name: gate2-transparency
          path: target/vaa-transparency/gate2/
          if-no-files-found: error

  # H3: live HlaX64 emit must match committed candidate, then Gate smokes.
  hlax64-bridge:
    name: HlaX64 emit + SemASM Gate (Win64)
    runs-on: windows-latest
    steps:
      - name: Checkout VAA
        uses: actions/checkout@v6

      - name: Checkout SemASM
        uses: actions/checkout@v6
        with:
          repository: megaalive/semasm
          path: semasm
          # Pin: match integrations/hlax64/stack.lock.toml (Phase E pure-int oracles).
          ref: 6018502805778590d021447ff246182493a77a49

      - name: Checkout HlaX64
        uses: actions/checkout@v6
        with:
          repository: megaalive/hlax64
          path: hlax64
          # Pin: match integrations/hlax64/stack.lock.toml (distinct IR→NASM map lines).
          ref: 1500d2284715eedbb217a0c94cdfa85f757e7418

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install NASM and LLVM (lld-link)
        run: choco install nasm llvm --no-progress -y

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            semasm

      - name: Build SemASM CLI
        working-directory: semasm
        run: cargo build -p semasm-cli --release

      - name: Put semasm on PATH
        shell: pwsh
        run: |
          $semasmBin = Join-Path $env:GITHUB_WORKSPACE "semasm\target\release"
          if (-not (Test-Path (Join-Path $semasmBin "semasm.exe"))) {
            throw "semasm.exe missing under $semasmBin"
          }
          echo $semasmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$semasmBin;$env:PATH"
          Get-Command semasm | Format-List
          semasm --version

      - name: Doctor + live status compare (R6)
        shell: pwsh
        run: ./scripts/ci-doctor-live-probe.ps1

      - name: Emit HlaX64 NASM and compare to fixture
        shell: pwsh
        env:
          HLAX64_ROOT: ${{ github.workspace }}/hlax64
        run: |
          foreach ($leaf in @(
            @{ Name = "sum_i64"; Script = "regen-hlax64-sum_i64.ps1"; Source = "hlax64/examples/interop/semasm-vaa/sum_i64/sum_i64.hla64"; Fixture = "fixtures/ingest/hlax64_sum_i64/candidate.asm" },
            @{ Name = "find_last_byte"; Script = "regen-hlax64-find_last_byte.ps1"; Source = "hlax64/examples/interop/semasm-vaa/find_last_byte/find_last_byte.hla64"; Fixture = "fixtures/ingest/hlax64_find_last_byte/candidate.asm" }
            @{ Name = "memcmp"; Script = "regen-hlax64-memcmp.ps1"; Source = "hlax64/examples/interop/semasm-vaa/memcmp/memcmp.hla64"; Fixture = "fixtures/ingest/hlax64_memcmp/candidate.asm" }
            @{ Name = "replace_byte"; Script = "regen-hlax64-replace_byte.ps1"; Source = "hlax64/examples/interop/semasm-vaa/replace_byte/replace_byte.hla64"; Fixture = "fixtures/ingest/hlax64_replace_byte/candidate.asm" }
            @{ Name = "count_byte"; Script = "regen-hlax64-count_byte.ps1"; Source = "hlax64/examples/interop/semasm-vaa/count_byte/count_byte.hla64"; Fixture = "fixtures/ingest/hlax64_count_byte/candidate.asm" }
            @{ Name = "find_first_byte"; Script = "regen-hlax64-find_first_byte.ps1"; Source = "hlax64/examples/interop/semasm-vaa/find_first_byte/find_first_byte.hla64"; Fixture = "fixtures/ingest/hlax64_find_first_byte/candidate.asm" }
            @{ Name = "memset"; Script = "regen-hlax64-memset.ps1"; Source = "hlax64/examples/interop/semasm-vaa/memset/memset.hla64"; Fixture = "fixtures/ingest/hlax64_memset/candidate.asm" }
            @{ Name = "memcpy"; Script = "regen-hlax64-memcpy.ps1"; Source = "hlax64/examples/interop/semasm-vaa/memcpy/memcpy.hla64"; Fixture = "fixtures/ingest/hlax64_memcpy/candidate.asm" }
            @{ Name = "min_usize"; Script = "regen-hlax64-min_usize.ps1"; Source = "hlax64/examples/interop/semasm-vaa/min_usize/min_usize.hla64"; Fixture = "fixtures/ingest/hlax64_min_usize/candidate.asm" }
            @{ Name = "max_usize"; Script = "regen-hlax64-max_usize.ps1"; Source = "hlax64/examples/interop/semasm-vaa/max_usize/max_usize.hla64"; Fixture = "fixtures/ingest/hlax64_max_usize/candidate.asm" }
          )) {
            $tmp = Join-Path $env:RUNNER_TEMP ("hlax64-" + $leaf.Name + ".asm")
            dotnet run --project hlax64/src/HlaX64.Cli --no-launch-profile -- emit-nasm `
              $leaf.Source `
              --target windows-x64-msabi --output-kind shared-library -o $tmp
            $committed = (Get-Content -Raw $leaf.Fixture) -replace "`r`n", "`n"
            $emitted = (Get-Content -Raw $tmp) -replace "`r`n", "`n"
            if ($committed -ne $emitted) {
              Write-Error "Committed $($leaf.Fixture) drifts from HlaX64 emit-nasm. Run scripts/$($leaf.Script)"
            }
            Write-Host "$($leaf.Name) candidate.asm matches HlaX64 emit"
          }

      - name: Live HlaX64 pack scalar suite (generate-only)
        shell: pwsh
        env:
          HLAX64_ROOT: ${{ github.workspace }}/hlax64
        run: |
          # Milestone 6 live suite path: generation + identity via pack spec.
          # --skip-verify ⇒ Incomplete ≠ Verified (SemASM Gate remains the
          # existing hlax64-bridge ingest steps below / above).
          ./scripts/run-hlax64-suite.ps1 `
            -Suite integrations/hlax64/suites/scalar-win64.vaa-suite.toml `
            -Repo $env:HLAX64_ROOT `
            -SkipVerify `
            -Output target/hlax64-suite-runs/scalar-win64-evidence.json
          if (-not (Test-Path target/hlax64-suite-runs/scalar-win64-evidence.json)) {
            throw "scalar suite evidence missing"
          }
          Get-Content target/hlax64-suite-runs/scalar-win64-evidence.json | Select-Object -First 30

      - name: Gate HlaX64 pack scalar suite (generate + SemASM Verified)
        shell: pwsh
        env:
          HLAX64_ROOT: ${{ github.workspace }}/hlax64
        run: |
          # Pack path Gate: live generate → SemASM agent verify --allow-execution.
          # Expects suite Accepted with Verified cases. Practice seal ≠ trust root.
          # Relies on semasm already on PATH from earlier steps.
          ./scripts/run-hlax64-suite.ps1 `
            -Gate `
            -Suite integrations/hlax64/suites/scalar-win64.vaa-suite.toml `
            -Repo $env:HLAX64_ROOT `
            -RunDir target/hlax64-suite-runs/scalar-gate `
            -Output target/hlax64-suite-runs/scalar-gate-evidence.json
          $ev = Get-Content -Raw target/hlax64-suite-runs/scalar-gate-evidence.json | ConvertFrom-Json
          if ([string]$ev.status -notin @('accepted','Accepted')) {
            throw "Gate pack suite status=$($ev.status) (expected Accepted)"
          }
          foreach ($c in $ev.cases) {
            if ([string]$c.status -ne 'Verified') {
              throw "Gate case $($c.case_id) status=$($c.status) (expected Verified)"
            }
          }
          Write-Host "Gate pack scalar suite Accepted (2 Verified)"
          Get-Content target/hlax64-suite-runs/scalar-gate-evidence.json | Select-Object -First 30

      - name: Gate HlaX64 pack scalar i64 suite (generate + SemASM Verified)
        shell: pwsh
        env:
          HLAX64_ROOT: ${{ github.workspace }}/hlax64
        run: |
          # Plan §17.5 Phase A named i64: return/add/sub/min/max/abs_i64.
          # Requires SemASM 566ca8e+ (builtin.pure_int.binary_i64 / unary_i64).
          # Expects suite Accepted with 6 Verified cases. Practice seal ≠ trust root.
          ./scripts/run-hlax64-suite.ps1 `
            -Gate `
            -Suite integrations/hlax64/suites/scalar-i64-win64.vaa-suite.toml `
            -Repo $env:HLAX64_ROOT `
            -RunDir target/hlax64-suite-runs/scalar-i64-gate `
            -Output target/hlax64-suite-runs/scalar-i64-gate-evidence.json
          $ev = Get-Content -Raw target/hlax64-suite-runs/scalar-i64-gate-evidence.json | ConvertFrom-Json
          if ([string]$ev.status -notin @('accepted','Accepted')) {
            throw "Gate i64 pack suite status=$($ev.status) (expected Accepted)"
          }
          if (@($ev.cases).Count -ne 6) {
            throw "Gate i64 pack suite expected 6 cases, got $(@($ev.cases).Count)"
          }
          foreach ($c in $ev.cases) {
            if ([string]$c.status -ne 'Verified') {
              throw "Gate case $($c.case_id) status=$($c.status) (expected Verified)"
            }
          }
          Write-Host "Gate pack scalar i64 suite Accepted (6 Verified)"
          Get-Content target/hlax64-suite-runs/scalar-i64-gate-evidence.json | Select-Object -First 30

      - name: Gate HlaX64 pack Phase B loop/stack suite (generate + SemASM Verified)
        shell: pwsh
        env:
          HLAX64_ROOT: ${{ github.workspace }}/hlax64
        run: |
          # Plan §17.2 Phase B named loops/stack. Requires SemASM 3cae1e1+
          # (unary i64 v2: sum_range / countdown / identity aliases).
          ./scripts/run-hlax64-suite.ps1 `
            -Gate `
            -Suite integrations/hlax64/suites/loop-stack-win64.vaa-suite.toml `
            -Repo $env:HLAX64_ROOT `
            -RunDir target/hlax64-suite-runs/loop-stack-gate `
            -Output target/hlax64-suite-runs/loop-stack-gate-evidence.json
          $ev = Get-Content -Raw target/hlax64-suite-runs/loop-stack-gate-evidence.json | ConvertFrom-Json
          if ([string]$ev.status -notin @('accepted','Accepted')) {
            throw "Gate Phase B suite status=$($ev.status) (expected Accepted)"
          }
          if (@($ev.cases).Count -ne 4) {
            throw "Gate Phase B suite expected 4 cases, got $(@($ev.cases).Count)"
          }
          foreach ($c in $ev.cases) {
            if ([string]$c.status -ne 'Verified') {
              throw "Gate case $($c.case_id) status=$($c.status) (expected Verified)"
            }
          }
          # Milestone 5 pack-side: generator emits candidate.map.json (schema 0.1).
          $maps = Get-ChildItem target/hlax64-suite-runs/loop-stack-gate -Recurse -Filter candidate.map.json
          if ($maps.Count -lt 4) {
            throw "expected >=4 candidate.map.json sidecars, got $($maps.Count)"
          }
          $join = & cargo run -q -- generator map-join $maps[0].FullName --line 7 --format json
          if ($LASTEXITCODE -ne 0) { throw "map-join failed on $($maps[0].FullName)" }
          # Quality: IR→NASM lines must not all collapse onto one label line.
          $json = Get-Content -Raw $maps[0].FullName | ConvertFrom-Json
          $distinct = @($json.entries | ForEach-Object { $_.assembly_line } | Select-Object -Unique)
          if ($distinct.Count -lt 2) {
            throw "source map quality: expected >=2 distinct assembly_line values"
          }
          $withCs = @($json.entries | Where-Object { $_.compiler_source -or $_.generator_source })
          if ($withCs.Count -lt 1) {
            throw "source map quality: expected compiler_source on at least one entry"
          }
          Write-Host "Gate pack Phase B Accepted (4 Verified) + source maps joinable ($($distinct.Count) distinct lines, compiler_source present)"
          Get-Content target/hlax64-suite-runs/loop-stack-gate-evidence.json | Select-Object -First 30

      - name: Gate HlaX64 pack Phase C memory-read (VerifiedUnderPreconditions)
        shell: pwsh
        env:
          HLAX64_ROOT: ${{ github.workspace }}/hlax64
        run: |
          # Honesty: memory-leaf affine ⇒ verified_under_preconditions ≠ verified.
          ./scripts/run-hlax64-suite.ps1 -Gate `
            -Suite integrations/hlax64/suites/memory-read-win64.vaa-suite.toml `
            -Repo $env:HLAX64_ROOT `
            -RunDir target/hlax64-suite-runs/memory-read-gate `
            -Output target/hlax64-suite-runs/memory-read-gate-evidence.json
          $ev = Get-Content -Raw target/hlax64-suite-runs/memory-read-gate-evidence.json | ConvertFrom-Json
          if ([string]$ev.status -notin @('accepted','Accepted')) { throw "Phase C status=$($ev.status)" }
          Write-Host "Gate pack Phase C Accepted (VerifiedUnderPreconditions)"

      - name: Gate HlaX64 pack Phase D memory-write (VerifiedUnderPreconditions)
        shell: pwsh
        env:
          HLAX64_ROOT: ${{ github.workspace }}/hlax64
        run: |
          ./scripts/run-hlax64-suite.ps1 -Gate `
            -Suite integrations/hlax64/suites/memory-write-win64.vaa-suite.toml `
            -Repo $env:HLAX64_ROOT `
            -RunDir target/hlax64-suite-runs/memory-write-gate `
            -Output target/hlax64-suite-runs/memory-write-gate-evidence.json
          $ev = Get-Content -Raw target/hlax64-suite-runs/memory-write-gate-evidence.json | ConvertFrom-Json
          if ([string]$ev.status -notin @('accepted','Accepted')) { throw "Phase D status=$($ev.status)" }
          Write-Host "Gate pack Phase D Accepted (VerifiedUnderPreconditions)"

      - name: Gate HlaX64 pack memory-concrete cells (unconditional Verified)
        shell: pwsh
        env:
          HLAX64_ROOT: ${{ github.workspace }}/hlax64
        run: |
          # Literal region length ⇒ SemASM verified (≠ under_preconditions).
          # Requires SemASM 28fb22f+ (load_byte0 / store_byte0 oracles).
          ./scripts/run-hlax64-suite.ps1 -Gate `
            -Suite integrations/hlax64/suites/memory-concrete-win64.vaa-suite.toml `
            -Repo $env:HLAX64_ROOT `
            -RunDir target/hlax64-suite-runs/memory-concrete-gate `
            -Output target/hlax64-suite-runs/memory-concrete-gate-evidence.json
          $ev = Get-Content -Raw target/hlax64-suite-runs/memory-concrete-gate-evidence.json | ConvertFrom-Json
          if ([string]$ev.status -notin @('accepted','Accepted')) { throw "memory-concrete status=$($ev.status)" }
          if (@($ev.cases).Count -ne 2) { throw "memory-concrete expected 2 cases" }
          foreach ($c in $ev.cases) {
            if ([string]$c.status -ne 'Verified') {
              throw "memory-concrete $($c.case_id)=$($c.status) (expected Verified, not under_preconditions)"
            }
          }
          Write-Host "Gate pack memory-concrete Accepted (2 Verified)"

      - name: Gate EchoAsm concrete cells (second-generator Verified)
        shell: pwsh
        run: |
          # Universality: EchoAsm copy-generator + SemASM concrete cell Gate.
          # load_byte0 + store_byte0. Practice seal ≠ trust root.
          if (-not $env:VAA_SEAL_SIGNING_KEY) {
            ./scripts/ci-gate-sign-setup.ps1
          }
          New-Item -ItemType Directory -Force -Path target/echoasm-suite-runs/concrete-gate | Out-Null
          cargo run -q -- suite run integrations/echoasm/suites/gate-concrete-win64.vaa-suite.toml `
            --repo . `
            --run-dir target/echoasm-suite-runs/concrete-gate `
            --output target/echoasm-suite-runs/concrete-gate-evidence.json `
            --skip-repo-guard `
            --allow-execution
          $ev = Get-Content -Raw target/echoasm-suite-runs/concrete-gate-evidence.json | ConvertFrom-Json
          if ([string]$ev.status -notin @('accepted','Accepted')) { throw "EchoAsm Gate status=$($ev.status)" }
          if (@($ev.cases).Count -ne 2) { throw "EchoAsm Gate expected 2 cases" }
          foreach ($c in $ev.cases) {
            if ([string]$c.status -ne 'Verified') { throw "EchoAsm $($c.case_id)=$($c.status)" }
          }
          Write-Host "Gate EchoAsm concrete cells Accepted (2 Verified)"

      - name: Gate EchoAsm scalar-i64 (second-generator Verified)
        shell: pwsh
        run: |
          # Beyond concrete cells: pure-int identity via copy-generator.
          if (-not $env:VAA_SEAL_SIGNING_KEY) {
            ./scripts/ci-gate-sign-setup.ps1
          }
          New-Item -ItemType Directory -Force -Path target/echoasm-suite-runs/scalar-i64-gate | Out-Null
          cargo run -q -- suite run integrations/echoasm/suites/gate-scalar-i64-win64.vaa-suite.toml `
            --repo . `
            --run-dir target/echoasm-suite-runs/scalar-i64-gate `
            --output target/echoasm-suite-runs/scalar-i64-gate-evidence.json `
            --skip-repo-guard `
            --allow-execution
          $ev = Get-Content -Raw target/echoasm-suite-runs/scalar-i64-gate-evidence.json | ConvertFrom-Json
          if ([string]$ev.status -notin @('accepted','Accepted')) { throw "EchoAsm scalar Gate status=$($ev.status)" }
          if (@($ev.cases).Count -ne 2) { throw "EchoAsm scalar Gate expected 2 cases" }
          foreach ($c in $ev.cases) {
            if ([string]$c.status -ne 'Verified') { throw "EchoAsm $($c.case_id)=$($c.status)" }
          }
          Write-Host "Gate EchoAsm scalar-i64 Accepted (2 Verified)"

      - name: Gate EchoAsm Phase B loops (second-generator Verified)
        shell: pwsh
        run: |
          # Phase B: sum_range + countdown_loop via copy-generator.
          if (-not $env:VAA_SEAL_SIGNING_KEY) {
            ./scripts/ci-gate-sign-setup.ps1
          }
          New-Item -ItemType Directory -Force -Path target/echoasm-suite-runs/phase-b-gate | Out-Null
          cargo run -q -- suite run integrations/echoasm/suites/gate-phase-b-loops-win64.vaa-suite.toml `
            --repo . `
            --run-dir target/echoasm-suite-runs/phase-b-gate `
            --output target/echoasm-suite-runs/phase-b-gate-evidence.json `
            --skip-repo-guard `
            --allow-execution
          $ev = Get-Content -Raw target/echoasm-suite-runs/phase-b-gate-evidence.json | ConvertFrom-Json
          if ([string]$ev.status -notin @('accepted','Accepted')) { throw "EchoAsm Phase B Gate status=$($ev.status)" }
          if (@($ev.cases).Count -ne 2) { throw "EchoAsm Phase B Gate expected 2 cases" }
          foreach ($c in $ev.cases) {
            if ([string]$c.status -ne 'Verified') { throw "EchoAsm $($c.case_id)=$($c.status)" }
          }
          Write-Host "Gate EchoAsm Phase B loops Accepted (2 Verified)"

      - name: Gate EchoAsm Phase B stack (second-generator Verified)
        shell: pwsh
        run: |
          if (-not $env:VAA_SEAL_SIGNING_KEY) {
            ./scripts/ci-gate-sign-setup.ps1
          }
          New-Item -ItemType Directory -Force -Path target/echoasm-suite-runs/phase-b-stack-gate | Out-Null
          cargo run -q -- suite run integrations/echoasm/suites/gate-phase-b-stack-win64.vaa-suite.toml `
            --repo . `
            --run-dir target/echoasm-suite-runs/phase-b-stack-gate `
            --output target/echoasm-suite-runs/phase-b-stack-gate-evidence.json `
            --skip-repo-guard `
            --allow-execution
          $ev = Get-Content -Raw target/echoasm-suite-runs/phase-b-stack-gate-evidence.json | ConvertFrom-Json
          if ([string]$ev.status -notin @('accepted','Accepted')) { throw "EchoAsm stack Gate status=$($ev.status)" }
          if (@($ev.cases).Count -ne 2) { throw "EchoAsm stack Gate expected 2 cases" }
          foreach ($c in $ev.cases) {
            if ([string]$c.status -ne 'Verified') { throw "EchoAsm $($c.case_id)=$($c.status)" }
          }
          Write-Host "Gate EchoAsm Phase B stack Accepted (2 Verified)"

      - name: Gate EchoAsm Phase E calls/data (second-generator Verified)
        shell: pwsh
        run: |
          if (-not $env:VAA_SEAL_SIGNING_KEY) {
            ./scripts/ci-gate-sign-setup.ps1
          }
          New-Item -ItemType Directory -Force -Path target/echoasm-suite-runs/phase-e-gate | Out-Null
          cargo run -q -- suite run integrations/echoasm/suites/gate-phase-e-calls-win64.vaa-suite.toml `
            --repo . `
            --run-dir target/echoasm-suite-runs/phase-e-gate `
            --output target/echoasm-suite-runs/phase-e-gate-evidence.json `
            --skip-repo-guard `
            --allow-execution
          $ev = Get-Content -Raw target/echoasm-suite-runs/phase-e-gate-evidence.json | ConvertFrom-Json
          if ([string]$ev.status -notin @('accepted','Accepted')) { throw "EchoAsm Phase E Gate status=$($ev.status)" }
          if (@($ev.cases).Count -ne 5) { throw "EchoAsm Phase E Gate expected 5 cases" }
          foreach ($c in $ev.cases) {
            if ([string]$c.status -ne 'Verified') { throw "EchoAsm $($c.case_id)=$($c.status)" }
          }
          Write-Host "Gate EchoAsm Phase E calls/data Accepted (5 Verified)"

      - name: Gate HlaX64 pack Phase E calls/data (SemASM Verified)
        shell: pwsh
        env:
          HLAX64_ROOT: ${{ github.workspace }}/hlax64
        run: |
          # Requires SemASM ecde423+ (Phase E pure-int oracles).
          ./scripts/run-hlax64-suite.ps1 -Gate `
            -Suite integrations/hlax64/suites/calls-data-win64.vaa-suite.toml `
            -Repo $env:HLAX64_ROOT `
            -RunDir target/hlax64-suite-runs/calls-data-gate `
            -Output target/hlax64-suite-runs/calls-data-gate-evidence.json
          $ev = Get-Content -Raw target/hlax64-suite-runs/calls-data-gate-evidence.json | ConvertFrom-Json
          if ([string]$ev.status -notin @('accepted','Accepted')) { throw "Phase E status=$($ev.status)" }
          if (@($ev.cases).Count -ne 5) { throw "Phase E expected 5 cases" }
          foreach ($c in $ev.cases) {
            if ([string]$c.status -ne 'Verified') { throw "Phase E $($c.case_id)=$($c.status)" }
          }
          Write-Host "Gate pack Phase E Accepted (5 Verified)"

      - name: Negative HlaX64 suite must Reject (locked wrong min_i64)
        shell: pwsh
        env:
          HLAX64_ROOT: ${{ github.workspace }}/hlax64
        run: |
          ./scripts/ci-negative-suite-reject.ps1 `
            -Repo $env:HLAX64_ROOT `
            -RunDir target/hlax64-suite-runs/negative-reject `
            -Output target/hlax64-suite-runs/negative-reject-evidence.json

      - name: Live HlaX64 Phase E calls/data suite (generate-only)
        shell: pwsh
        env:
          HLAX64_ROOT: ${{ github.workspace }}/hlax64
        run: |
          # Plan §17.5 Phase E: call ABI, sections, aggregate layout.
          # --skip-verify ⇒ Incomplete ≠ Verified.
          ./scripts/run-hlax64-suite.ps1 `
            -Suite integrations/hlax64/suites/calls-data-win64.vaa-suite.toml `
            -Repo $env:HLAX64_ROOT `
            -SkipVerify `
            -RunDir target/hlax64-suite-runs/calls-data `
            -Output target/hlax64-suite-runs/calls-data-evidence.json
          if (-not (Test-Path target/hlax64-suite-runs/calls-data-evidence.json)) {
            throw "calls-data suite evidence missing"
          }
          Get-Content target/hlax64-suite-runs/calls-data-evidence.json | Select-Object -First 30

      - name: Live HlaX64 SysV scalar suite (generate-only, System V ABI)
        shell: pwsh
        env:
          HLAX64_ROOT: ${{ github.workspace }}/hlax64
        run: |
          # SysV live: emit-nasm --target linux-x64-sysv via generator.sysv.spec.
          # Emitting from any host is fine (text-only); --skip-verify ⇒ Incomplete.
          ./scripts/run-hlax64-suite.ps1 `
            -Suite integrations/hlax64/suites/scalar-sysv.vaa-suite.toml `
            -Repo $env:HLAX64_ROOT `
            -SkipVerify `
            -RunDir target/hlax64-suite-runs/scalar-sysv `
            -Output target/hlax64-suite-runs/scalar-sysv-evidence.json
          if (-not (Test-Path target/hlax64-suite-runs/scalar-sysv-evidence.json)) {
            throw "SysV suite evidence missing"
          }
          # Assert the emitted candidate actually uses System V argument registers.
          $cand = Get-ChildItem target/hlax64-suite-runs/scalar-sysv -Recurse -Filter candidate.asm |
            Select-Object -First 1
          if (-not $cand) { throw "SysV candidate.asm missing" }
          $asm = Get-Content -Raw $cand.FullName
          if ($asm -notmatch 'rdi' -or $asm -notmatch 'rsi') {
            throw "SysV candidate does not use rdi/rsi argument registers"
          }
          Write-Host "SysV candidate uses System V argument registers (rdi/rsi)"
          Get-Content target/hlax64-suite-runs/scalar-sysv-evidence.json | Select-Object -First 30

      - name: Upload HlaX64 pack suite evidence
        uses: actions/upload-artifact@v6
        with:
          name: hlax64-pack-scalar-suite-evidence
          path: target/hlax64-suite-runs/
          if-no-files-found: error

      - name: Gate ingest + Gate-2 verify for hlax64 leaves
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target/vaa-transparency/hlax64-gate1 | Out-Null
          ./scripts/ci-gate-sign-setup.ps1 -PublicKeyOut target/vaa-transparency/hlax64-gate1/public_key.txt
          cargo test --test semasm_gate1_smoke gate1_ingest_hlax64_sum_i64_verify_chain -- --ignored --nocapture
          cargo test --test semasm_gate2_smoke gate2_verify_hlax64_sum_i64_win64_verified -- --ignored --nocapture
          cargo test --test semasm_gate1_smoke gate1_ingest_hlax64_find_last_byte_verify_chain -- --ignored --nocapture
          cargo test --test semasm_gate2_smoke gate2_verify_hlax64_find_last_byte_win64_verified -- --ignored --nocapture
          cargo test --test semasm_gate1_smoke gate1_ingest_hlax64_memcmp_verify_chain -- --ignored --nocapture
          cargo test --test semasm_gate2_smoke gate2_verify_hlax64_memcmp_win64_verified -- --ignored --nocapture
          cargo test --test semasm_gate1_smoke gate1_ingest_hlax64_replace_byte_verify_chain -- --ignored --nocapture
          cargo test --test semasm_gate2_smoke gate2_verify_hlax64_replace_byte_win64_verified -- --ignored --nocapture
          cargo test --test semasm_gate1_smoke gate1_ingest_hlax64_count_byte_verify_chain -- --ignored --nocapture
          cargo test --test semasm_gate2_smoke gate2_verify_hlax64_count_byte_win64_verified -- --ignored --nocapture
          cargo test --test semasm_gate1_smoke gate1_ingest_hlax64_find_first_byte_verify_chain -- --ignored --nocapture
          cargo test --test semasm_gate2_smoke gate2_verify_hlax64_find_first_byte_win64_verified -- --ignored --nocapture
          cargo test --test semasm_gate1_smoke gate1_ingest_hlax64_memset_verify_chain -- --ignored --nocapture
          cargo test --test semasm_gate2_smoke gate2_verify_hlax64_memset_win64_verified -- --ignored --nocapture
          cargo test --test semasm_gate1_smoke gate1_ingest_hlax64_memcpy_verify_chain -- --ignored --nocapture
          cargo test --test semasm_gate2_smoke gate2_verify_hlax64_memcpy_win64_verified -- --ignored --nocapture
          cargo test --test semasm_gate1_smoke gate1_ingest_hlax64_min_usize_verify_chain -- --ignored --nocapture
          cargo test --test semasm_gate2_smoke gate2_verify_hlax64_min_usize_win64_verified -- --ignored --nocapture
          cargo test --test semasm_gate1_smoke gate1_ingest_hlax64_max_usize_verify_chain -- --ignored --nocapture
          cargo test --test semasm_gate2_smoke gate2_verify_hlax64_max_usize_win64_verified -- --ignored --nocapture

      - name: Export + verify-transparency (HlaX64 Gate-1)
        shell: pwsh
        run: |
          ./scripts/ci-gate-transparency.ps1 `
            -RunBase target/vaa-gate1-hlax64-runs `
            -OutDir target/vaa-transparency/hlax64-gate1 `
            -PublicKeySrc target/vaa-transparency/hlax64-gate1/public_key.txt

      - name: Upload HlaX64 Gate-1 transparency artifact
        uses: actions/upload-artifact@v6
        with:
          name: hlax64-gate1-transparency
          path: target/vaa-transparency/hlax64-gate1/
          if-no-files-found: error

  # Gate-1 Linux: live SemASM Incomplete smoke (count_byte/sysv64, no --allow-execution).
  # VAA+SemASM smoke on the pinned SemASM SHA â€” not a claim SemASM Linux is upstream CI-verified.
  semasm-gate1-linux:
    name: Gate-1 SemASM Incomplete (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VAA
        uses: actions/checkout@v6

      - name: Checkout SemASM
        uses: actions/checkout@v6
        with:
          repository: megaalive/semasm
          path: semasm
          # Pin: SemASM tip 928bd66 (find_* memory-leaf + Sei).
          ref: 928bd66569320674cd49e4dd7758da17b03338c2

      - name: Install NASM, LLVM (ld.lld), and qemu-user
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm lld qemu-user
          command -v qemu-x86_64

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            semasm

      - name: Build SemASM CLI
        working-directory: semasm
        run: cargo build -p semasm-cli --release

      - name: Put semasm on PATH
        run: |
          SEMASM_BIN="${GITHUB_WORKSPACE}/semasm/target/release"
          test -x "${SEMASM_BIN}/semasm"
          echo "${SEMASM_BIN}" >> "$GITHUB_PATH"
          export PATH="${SEMASM_BIN}:$PATH"
          command -v semasm
          semasm --version

      - name: Doctor + live status compare (R6)
        run: |
          chmod +x scripts/ci-doctor-live-probe.sh scripts/ci-gate-sign-setup.sh scripts/ci-gate-transparency.sh
          ./scripts/ci-doctor-live-probe.sh

      - name: Record tool versions
        run: |
          nasm --version
          ld.lld --version || lld --version
          qemu-x86_64 --version | head -n1

      - name: Gate-1 Linux signed ingest + Incomplete verify
        run: |
          mkdir -p target/vaa-transparency/gate1-linux
          # Source so VAA_SEAL_* exports apply to cargo test in this step
          # (GITHUB_ENV only affects subsequent steps).
          # shellcheck disable=SC1091
          source ./scripts/ci-gate-sign-setup.sh target/vaa-transparency/gate1-linux/public_key.txt
          cargo test --test semasm_gate1_smoke linux -- --ignored --nocapture

      - name: Export + verify-transparency (Gate-1 Linux)
        run: |
          ./scripts/ci-gate-transparency.sh \
            --run-base target/vaa-gate1-linux-runs \
            --out-dir target/vaa-transparency/gate1-linux \
            --public-key-src target/vaa-transparency/gate1-linux/public_key.txt

      - name: Upload Gate-1 Linux transparency artifact
        uses: actions/upload-artifact@v6
        with:
          name: gate1-linux-transparency
          path: target/vaa-transparency/gate1-linux/
          if-no-files-found: error

  # Gate-2 Linux: opt-in behavioral Verified (count_byte sysv64 + --allow-execution).

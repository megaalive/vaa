      - name: Upload Gate-2 Linux transparency artifact
        uses: actions/upload-artifact@v6
        with:
          name: gate2-linux-transparency
          path: target/vaa-transparency/gate2-linux/
          if-no-files-found: error

  # Pack Gate SysV: live HlaX64 generate (linux-x64-sysv) + SemASM Verified on Linux.
  # Requires SemASM ecde423+ (SysV framed epilogue + Phase E pure-int oracles).
  # Practice seal != trust root.
  hlax64-pack-sysv-gate:
    name: Gate HlaX64 pack scalar SysV (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VAA
        uses: actions/checkout@v6

      - name: Checkout SemASM
        uses: actions/checkout@v6
        with:
          repository: megaalive/semasm
          path: semasm
          # Pin: match integrations/hlax64/stack.lock.toml (Phase E pure-int oracles).
          ref: 6018502805778590d021447ff246182493a77a49

      - name: Checkout HlaX64
        uses: actions/checkout@v6
        with:
          repository: megaalive/hlax64
          path: hlax64
          # Pin: match integrations/hlax64/stack.lock.toml (distinct IR→NASM map lines).
          ref: 1500d2284715eedbb217a0c94cdfa85f757e7418

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install NASM, LLVM (ld.lld), and qemu-user
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm lld qemu-user
          command -v qemu-x86_64

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            semasm

      - name: Build SemASM CLI
        working-directory: semasm
        run: cargo build -p semasm-cli --release

      - name: Put semasm on PATH
        run: |
          SEMASM_BIN="${GITHUB_WORKSPACE}/semasm/target/release"
          test -x "${SEMASM_BIN}/semasm"
          echo "${SEMASM_BIN}" >> "$GITHUB_PATH"
          export PATH="${SEMASM_BIN}:$PATH"
          command -v semasm
          semasm --version

      - name: Gate pack scalar-sysv (generate + SemASM Verified)
        env:
          HLAX64_ROOT: ${{ github.workspace }}/hlax64
        run: |
          set -euo pipefail
          chmod +x scripts/run-hlax64-suite.sh scripts/ci-gate-sign-setup.sh
          ./scripts/run-hlax64-suite.sh \
            --gate \
            --suite integrations/hlax64/suites/scalar-sysv.vaa-suite.toml \
            --repo "${HLAX64_ROOT}" \
            --run-dir target/hlax64-suite-runs/scalar-sysv-gate \
            --output target/hlax64-suite-runs/scalar-sysv-gate/suite-evidence.json
          python3 - <<'PY'
          import json
          ev = json.load(open("target/hlax64-suite-runs/scalar-sysv-gate/suite-evidence.json", encoding="utf-8"))
          assert ev.get("status", "").lower() == "accepted", ev
          for c in ev.get("cases", []):
              assert c.get("status") == "Verified", c
          print("Gate pack SysV Accepted:", [c["case_id"] for c in ev["cases"]])
          PY
          for f in target/hlax64-suite-runs/scalar-sysv-gate/suite-out/*/candidate.asm; do
            grep -Eq '\brdi\b' "$f"
            grep -Eq '\brsi\b' "$f"
            echo "SysV registers ok: $f"
          done

      - name: Gate pack scalar-i64 SysV (generate + SemASM Verified)
        env:
          HLAX64_ROOT: ${{ github.workspace }}/hlax64
        run: |
          set -euo pipefail
          ./scripts/run-hlax64-suite.sh \
            --gate \
            --suite integrations/hlax64/suites/scalar-i64-sysv.vaa-suite.toml \
            --repo "${HLAX64_ROOT}" \
            --run-dir target/hlax64-suite-runs/scalar-i64-sysv-gate \
            --output target/hlax64-suite-runs/scalar-i64-sysv-gate/suite-evidence.json
          python3 - <<'PY'
          import json
          ev = json.load(open("target/hlax64-suite-runs/scalar-i64-sysv-gate/suite-evidence.json", encoding="utf-8"))
          assert ev.get("status", "").lower() == "accepted", ev
          assert len(ev.get("cases", [])) == 6, ev
          for c in ev["cases"]:
              assert c.get("status") == "Verified", c
          print("Gate pack scalar-i64 SysV Accepted:", [c["case_id"] for c in ev["cases"]])
          PY

      - name: Gate pack loop-stack SysV (generate + SemASM Verified)
        env:
          HLAX64_ROOT: ${{ github.workspace }}/hlax64
        run: |
          set -euo pipefail
          ./scripts/run-hlax64-suite.sh \
            --gate \
            --suite integrations/hlax64/suites/loop-stack-sysv.vaa-suite.toml \
            --repo "${HLAX64_ROOT}" \
            --run-dir target/hlax64-suite-runs/loop-stack-sysv-gate \
            --output target/hlax64-suite-runs/loop-stack-sysv-gate/suite-evidence.json
          python3 - <<'PY'
          import json
          ev = json.load(open("target/hlax64-suite-runs/loop-stack-sysv-gate/suite-evidence.json", encoding="utf-8"))
          assert ev.get("status", "").lower() == "accepted", ev
          assert len(ev.get("cases", [])) == 4, ev
          for c in ev["cases"]:
              assert c.get("status") == "Verified", c
          print("Gate pack loop-stack SysV Accepted:", [c["case_id"] for c in ev["cases"]])
          PY

      - name: Upload SysV pack Gate evidence
        uses: actions/upload-artifact@v6
        with:
          name: hlax64-pack-sysv-gate-evidence
          path: target/hlax64-suite-runs/scalar-sysv-gate/
          if-no-files-found: error

  # Milestone 6: generator pack matrix (schema / parity / repair evidence).
  # Structural verification includes EchoAsm fixtures + the sealed HlaX64
  # live-repair packet/evidence; live Gate execution is in dedicated jobs.
  generator-packs:
    name: Generator packs matrix
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Pack matrix (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci-generator-packs.ps1
      - name: Pack matrix (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cargo build -q
          ./scripts/ci-generator-packs.sh
